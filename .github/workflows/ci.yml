name: CI

# No secret, no model: every test uses a fake judge or a fake Ollama client.
# OLLAMA_HOST points at a closed port, so a test that tried to reach a real
# model would fail at once instead of hanging.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OLLAMA_HOST: http://127.0.0.1:9
  CREWAI_DISABLE_TELEMETRY: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests (LangGraph)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-crew.txt
      # The data gateway first: pyproject.toml lists readonly-sql-mcp as a dependency,
      # and it is installed from GitHub (it is not on PyPI under that name).
      - name: Install readonly-sql-mcp, then the project
        run: |
          python -m pip install "git+https://github.com/DynasR/readonly-sql-mcp"
          python -m pip install -e ".[dev]"
      - name: Run the tests
        run: python -m pytest -q

  mutation:
    name: Mutation check
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-crew.txt
      # tools/mutation_check.py runs the crew mutations too: it looks for .venv-crew
      # (CrewAI) next to the project, and the CrewAI tests look for .venv (the MCP
      # server's interpreter). Same layout as the README, built here.
      - name: Build .venv (LangGraph, MCP server) and .venv-crew (CrewAI)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "git+https://github.com/DynasR/readonly-sql-mcp"
          .venv/bin/python -m pip install -e ".[dev]"
          python -m venv .venv-crew
          .venv-crew/bin/python -m pip install -r requirements-crew.txt
          .venv-crew/bin/python -m pip install --no-deps -e .
      - name: Break each protection on purpose, require a test to fail (about 20 minutes)
        run: .venv/bin/python tools/mutation_check.py
      - name: The sources must be back byte for byte
        run: git diff --exit-code

  crew:
    name: Tests (CrewAI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-crew.txt
      # Two environments, as crewai pins mcp<2 (see requirements-crew.txt). The MCP server
      # runs with .venv, which crew/bank.py finds by itself (.venv/bin/python).
      - name: Build .venv (MCP server) and .venv-crew (CrewAI)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "git+https://github.com/DynasR/readonly-sql-mcp"
          python -m venv .venv-crew
          .venv-crew/bin/python -m pip install -r requirements-crew.txt
          .venv-crew/bin/python -m pip install --no-deps -e .
      # tests_crew/conftest.py skips everything when crewai cannot be imported: without
      # this line a broken install would give a green job and zero tests.
      - name: CrewAI must import
        run: .venv-crew/bin/python -c "import crewai, mcp; print('crewai and mcp import')"
      - name: Run the CrewAI tests
        run: .venv-crew/bin/python -m pytest tests_crew -q -rs
